<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takahiro Torii — Apps</title>
<style>
  :root { --ink:#1c1c1e; --muted:#6b6b70; --rule:#e4e4e7; --bg:#fff; --accent:#c9b817; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#ececef; --muted:#9a9aa0; --rule:#303034; --bg:#131315; }
  }
  body {
    margin:0; padding:4rem 1.25rem;
    background:var(--bg); color:var(--ink);
    font:16px/1.7 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main { max-width:34rem; margin:0 auto; }
  h1 { font-size:1.4rem; margin:0 0 2.5rem; letter-spacing:-.01em; }
  h2 { font-size:1.05rem; margin:0 0 .25rem; }
  .app { padding:1.5rem 0; border-top:1px solid var(--rule); }
  .desc { color:var(--muted); margin:0 0 .75rem; }
  a { color:inherit; text-decoration-color:var(--accent); text-underline-offset:3px; }
  .links a { margin-right:1.25rem; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Takahiro Torii</h1>

  <div class="app">
    <h2>HIIT &amp; Tabata Timer</h2>
    <p class="desc">A dead simple interval timer.</p>
    <p class="links">
      <a href="https://apps.apple.com/app/id1166542235">App Store</a>
      <a href="/tabata-timer/privacy.html">Privacy Policy</a>
    </p>
  </div>
</main>
</body>
</html>
